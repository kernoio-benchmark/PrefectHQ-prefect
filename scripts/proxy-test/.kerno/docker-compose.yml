services:
  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile: ${DOCKERFILE_PATH}
    env_file:
      - .env
    ports:
      - "4200:4200"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:4200/api/health || exit 1
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
