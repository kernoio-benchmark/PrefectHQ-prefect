services:
  postgres:
    image: "postgres:16-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=prefect"
      - "POSTGRES_PASSWORD=${PREFECT_SERVER_DATABASE_PASSWORD}"
      - "POSTGRES_DB=prefect"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U prefect -d prefect"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/prefect?user=prefect&password=${PREFECT_SERVER_DATABASE_PASSWORD}

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile: ${DOCKERFILE_PATH}
      args:
        PREFECT_EXTRAS: "[server]"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "4200"
    command: |
      bash -c '
        prefect server database upgrade -y &&
        prefect server start --host 0.0.0.0 --port 4200
      '
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:4200/api/health || exit 1
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
